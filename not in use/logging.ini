[loggers]
keys=root,PersistentSystem

[handlers]
keys=applicationHandler,errorHandler

[formatters]
keys=simpleFormatter

# ---------------- ROOT LOGGER ----------------

[logger_root]
level=INFO
handlers=

# ---------------- APPLICATION LOGGER ----------------

[logger_PersistentSystem]
level=INFO
handlers=applicationHandler,errorHandler
qualname=PersistentSystem
propagate=0

# ---------------- APPLICATION LOG ----------------

[handler_applicationHandler]
class=FileHandler
level=INFO
formatter=simpleFormatter
args=('logs/application.log','a','utf-8')

# ---------------- ERROR LOG ----------------

[handler_errorHandler]
class=FileHandler
level=ERROR
formatter=simpleFormatter
args=('logs/error.log','a','utf-8')

# ---------------- FORMAT ----------------

[formatter_simpleFormatter]
format=%(asctime)s | %(levelname)s | %(message)s
datefmt=%Y-%m-%d %H:%M:%S